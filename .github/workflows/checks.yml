# checks.yml: the checks Claude used to run on Kelvin's laptop, run by GitHub
# instead, so a phase pushed while the laptop sleeps is still checked (D-98).
#   - tests: scripts/test-logic.sh and scripts/test-store.sh on Linux, the same
#     scripts Kelvin runs in WSL. Every push.
#   - ios-build: the app built for iOS without signing, on a Mac. On ios/*
#     branches and by hand. (The repo is public, so Actions minutes are free.)
name: checks

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v5
      - name: Python (test-store.sh uses it to isolate the planner file)
        run: command -v python3 || (apt-get update && apt-get install -y python3)
      - name: Logic tests
        shell: bash
        run: |
          swift --version | head -1 | while read -r line; do echo "::notice::$line"; done
          set -o pipefail
          bash scripts/test-logic.sh 2>&1 | tee logic.log
          grep -E "Test run with" logic.log | while read -r line; do echo "::notice::logic: $line"; done
      - name: Store tests
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test-store.sh 2>&1 | tee store.log
          grep -E "Test run with" store.log | while read -r line; do echo "::notice::store: $line"; done
      - name: Failures as annotations
        if: failure()
        shell: bash
        run: |
          cat logic.log store.log 2>/dev/null | grep -E "error:|✘" | sort -u | head -40 \
            | while read -r line; do echo "::error::$line"; done

  ios-build:
    if: startsWith(github.ref, 'refs/heads/ios/') || github.event_name == 'workflow_dispatch'
    # The newest image and its newest Xcode: the laptop builds with Swift 6.4
    # against a recent iOS SDK, and Xcode 16 (macos-15) rejects code that
    # SDK accepts (UNUserNotificationCenterDelegate's sendability).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode on the image
        shell: bash
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "::notice::using $newest"
          sudo xcode-select -s "$newest"
      - name: Build for iOS (no signing)
        shell: bash
        # The compiler's errors are also written as annotations (::error::),
        # because a cloud session can read those through the API when it
        # can't download the full log.
        run: |
          xcodebuild -version | while read -r line; do echo "::notice::$line"; done
          status=0
          xcodebuild -scheme ClassPing -destination 'generic/platform=iOS' \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || status=$?
          tail -80 build.log
          grep -E "error:|\*\* BUILD|xcodebuild: error" build.log | sort -u | head -40 \
            | while read -r line; do echo "::error::$line"; done
          exit $status
